# Point d'entrée GitOps : le seul fichier appliqué à la main, une fois.
# Ensuite, tout ajout ou modification passe par un commit dans ce dépôt.
#
#   kubectl1.33 --context gitops-kubeadm apply --server-side -f argocd/root-app.yaml
---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: platform
  namespace: argocd
spec:
  description: Application racine, limitée aux objets Argo CD du namespace argocd
  sourceRepos:
    - https://github.com/Aliyoub/argocd-gitops-platform.git
  destinations:
    - server: https://kubernetes.default.svc
      namespace: argocd
  # Aucune ressource cluster-scoped.
  clusterResourceWhitelist: []
  # Uniquement des AppProjects et des Applications : l'Application racine
  # déclare les applications, elle ne déploie rien d'autre.
  namespaceResourceWhitelist:
    - group: argoproj.io
      kind: AppProject
    - group: argoproj.io
      kind: Application
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root
  namespace: argocd
  # Pas de finalizer de cascade : supprimer l'Application racine par erreur
  # laisse les Applications filles et leurs ressources en place.
spec:
  project: platform
  source:
    repoURL: https://github.com/Aliyoub/argocd-gitops-platform.git
    targetRevision: main
    path: argocd
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
