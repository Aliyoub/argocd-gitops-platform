apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Contenu géré par l'Application racine (root-app.yaml) : les AppProjects et
# les Applications. Ajouter une application = ajouter ses deux fichiers ici.
#
# Volontairement absents :
# - bootstrap/ : l'installation d'Argo CD reste une opération manuelle ;
# - root-app.yaml : l'Application racine ne se gère pas elle-même.
resources:
  - projects/podinfo.yaml
  - applications/podinfo.yaml
