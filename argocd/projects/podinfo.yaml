apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: podinfo
  namespace: argocd
  annotations:
    # Créé avant l'Application qui y est rattachée, dans la même synchronisation.
    argocd.argoproj.io/sync-wave: "-1"
spec:
  description: Application podinfo, limitée à son namespace et à ce dépôt
  # Seule source autorisée : ce dépôt. Une Application du projet pointant vers
  # un autre dépôt est refusée.
  sourceRepos:
    - https://github.com/Aliyoub/argocd-gitops-platform.git
  # Seule destination autorisée : le namespace podinfo du cluster local.
  destinations:
    - server: https://kubernetes.default.svc
      namespace: podinfo
  # Ressources cluster-scoped : uniquement le Namespace nommé podinfo. Argo CD
  # ne confronte pas les objets cluster-scoped aux destinations : sans le champ
  # name, le projet pourrait créer n'importe quel namespace.
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
      name: podinfo
  # Ressources namespacées : ce que l'application déclare, plus les objets que
  # Kubernetes en dérive. Tout autre type (Secret, Role, ConfigMap...) est
  # refusé à la synchronisation.
  namespaceResourceWhitelist:
    - group: apps
      kind: Deployment
    # ReplicaSet et Pod ne sont pas déclarés dans Git, mais Argo CD masque de
    # l'arbre des ressources tout enfant non autorisé par le projet : sans eux,
    # ni pods, ni journaux, ni événements dans l'interface. Compromis : la même
    # liste autorise aussi à les déployer depuis Git (même namespace, PSA
    # restricted toujours appliqué).
    - group: apps
      kind: ReplicaSet
    - group: ""
      kind: Pod
    - group: ""
      kind: Service
